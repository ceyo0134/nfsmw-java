<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFS Most Wanted (web)</title>
<script src="https://cjrtnc.leaningtech.com/4.1/loader.js"></script>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px sans-serif; }
  #log { padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="log">Starting...</div>
<script type="module">
import { natives } from "./m3g-natives.js";

const log = document.getElementById("log");
const seen = [];
const origWarn = console.warn;
// Every M3G native the game calls for the first time is listed here, in call order.
console.warn = (...a) => {
  origWarn(...a);
  if (String(a[0]).startsWith("[m3g")) {
    seen.push(a[1]);
    log.textContent = "M3G natives hit so far (" + seen.length + "):\n" + seen.join("\n");
  }
};

try {
  await cheerpjInit({ natives });
  cheerpjCreateDisplay(480, 640);
  await cheerpjRunMain("WebMain", "/app/nfsmw-web.jar");
} catch (e) {
  log.textContent = "Error: " + e;
  console.error(e);
}
</script>
</body>
</html>
