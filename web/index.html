<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFS Most Wanted (web)</title>
<script src="https://cjrtnc.leaningtech.com/4.1/loader.js"></script>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px sans-serif; }
  #log { padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="log">Starting...</div>
<script type="module">
import { natives } from "./m3g-natives.js";

const log = document.getElementById("log");
const seen = [];
const lines = [];
function render() {
  log.textContent = "M3G natives hit (" + seen.length + ", last 40):\n" + seen.slice(-40).join("\n") +
    "\n\n--- console (last 40) ---\n" + lines.slice(-40).join("\n");
}
// Phone has no dev console, so mirror console output and errors onto the page.
for (const k of ["log", "warn", "error"]) {
  const orig = console[k].bind(console);
  console[k] = (...a) => {
    orig(...a);
    if (k === "warn" && String(a[0]).startsWith("[m3g")) seen.push(a[1]);
    else lines.push(k + ": " + a.map(x => (x && x.stack) || String(x)).join(" "));
    render();
  };
}
window.addEventListener("error", e => { lines.push("ERR: " + e.message); render(); });
window.addEventListener("unhandledrejection", e => { lines.push("REJECT: " + ((e.reason && e.reason.stack) || e.reason)); render(); });

function stage(t) { lines.push("[" + ((performance.now() / 1000) | 0) + "s] " + t); render(); }
stage("page loaded, starting CheerpJ");
const watchdog = setInterval(() => stage("still working (the first start downloads the Java runtime, can take a few minutes on mobile data)"), 20000);
try {
  await cheerpjInit({ natives });
  stage("cheerpjInit done");
  cheerpjCreateDisplay(480, 640);
  stage("display created, running WebMain");
  // CheerpJ maps /app/ to the server root; on a GitHub Pages project site the jar lives under /<repo>/.
  const base = location.pathname.replace(/[^/]*$/, "");
  const jar = "/app" + base + "nfsmw-web.jar";
  stage("jar path: " + jar);
  const code = await cheerpjRunMain("WebMain", jar);
  stage("WebMain exited with code " + code);
} catch (e) {
  stage("ERROR: " + ((e && e.stack) || e));
  console.error(e);
}
clearInterval(watchdog);
</script>
</body>
</html>
